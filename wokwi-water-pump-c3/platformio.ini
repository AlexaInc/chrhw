[platformio]
default_envs = wokwi

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@^2.7.2
  bblanchon/ArduinoJson@^6.21.5

; Wokwi's serial monitor is wired to the C3 TX/RX pins. Do NOT route Serial to
; native USB CDC in this build, otherwise only ROM boot text appears.
[env:wokwi]

; Physical ESP32-C3 SuperMini connected through its native USB connector.
; Build/upload explicitly with: pio run -e supermini-usb -t upload
[env:supermini-usb]
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
