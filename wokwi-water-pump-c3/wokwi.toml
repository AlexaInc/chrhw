[wokwi]
version = 1
firmware = "firmware/firmware.bin"
elf = "firmware/firmware.elf"

# Root-level JSON/WASM avoids VS Code local-chip routing showing the part as Missing.
[[chip]]
name = "buck5v"
binary = "buck5v.chip.wasm"

[[chip]]
name = "cap"
binary = "cap.chip.wasm"

[[chip]]
name = "ecap"
binary = "ecap.chip.wasm"

[[chip]]
name = "diode"
binary = "diode.chip.wasm"

[[chip]]
name = "fuse"
binary = "fuse.chip.wasm"
